# Whole stack:     docker compose up --build   -> http://localhost:3000
# Database only:   docker compose up -d mariadb (for running BE/FE locally)
services:
  mariadb:
    image: mariadb:11.4
    container_name: pokemon-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: pokemon
      MARIADB_USER: pokemon
      MARIADB_PASSWORD: pokemon
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - pokemon-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./BE
    image: pokemon-interface-be
    container_name: pokemon-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/pokemon
      SPRING_DATASOURCE_USERNAME: pokemon
      SPRING_DATASOURCE_PASSWORD: pokemon
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET:-docker-compose-secret-change-me-at-least-256-bits}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./FE
    image: pokemon-interface-fe
    container_name: pokemon-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pokemon-db-data:
