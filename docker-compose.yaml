services:
  mariadb:
    image: mariadb:11.4
    container_name: pokemon-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: pokemon
      MARIADB_USER: pokemon
      MARIADB_PASSWORD: pokemon
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - pokemon-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pokemon-db-data: