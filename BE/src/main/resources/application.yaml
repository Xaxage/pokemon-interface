spring:
  application:
    name: BE

  datasource:
    url: jdbc:mariadb://localhost:3306/pokemon
    username: pokemon
    password: pokemon
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
    show-sql: true

pokeapi:
  base-url: https://pokeapi.co/api/v2

security:
  jwt:
    # HS256 key for bearer tokens, at least 32 bytes. Set JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-development-secret-change-me-at-least-256-bits}
